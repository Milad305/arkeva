
name: Arkeva CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @projeyar/shared run build

      - name: Typecheck backend
        run: pnpm --filter @projeyar/backend run typecheck

      - name: Build backend
        run: pnpm --filter @projeyar/backend run build

      - name: Verify backend output
        run: test -f backend/dist/main.js

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /v1
          VITE_NODE_ENV: production
        run: pnpm --filter prozheh-yar-frontend run build

      - name: Verify frontend output
        run: test -f frontend/dist/index.html
