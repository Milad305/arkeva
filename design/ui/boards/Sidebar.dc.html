<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نوار کناری</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/projeyar/tokens.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pj sb" dir="rtl" lang="fa" style="font-family: 'Vazirmatn', system-ui, sans-serif; color: #18181B; background: #FFFFFF; width: 100%; min-height: 100%">
  <div class="sb-brand">
    <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h7l5 5v13"></path><path d="M9 12h6"></path><path d="M9 16h6"></path></svg><i></i></span>
    <div class="brand-t"><strong>پروژه‌یار</strong><small>پنل مدیریت پیشرفت</small></div>
  </div>
  <button class="sb-org" type="button" aria-label="تغییر سازمان">
    <span class="org-mark">ا.آ</span>
    <span class="col grow" style="line-height: 1.3"><strong class="t-13 fw6 trunc">شرکت آبادگران ایران</strong><small class="t-xs tx5">۱۲ پروژه فعال</small></span>
    <span class="tx5" style="display: inline-flex"><dc-import name="Icon" i="chevrons-up-down" sz="14" hint-size="14px,14px"></dc-import></span>
  </button>
  <div class="sb-sec">منوی اصلی</div>
  <nav class="sb-nav" aria-label="منوی اصلی">
    <sc-for list="{{main}}" as="it" hint-placeholder-count="7">
      <a class="nav-a {{it.on}}" href="{{it.f}}"><dc-import name="Icon" i="{{it.ic}}" sz="16" hint-size="16px,16px"></dc-import><span>{{it.t}}</span><sc-if value="{{it.hasN}}" hint-placeholder-val="{{false}}"><span class="cnt {{it.nc}}">{{it.n}}</span></sc-if></a>
    </sc-for>
  </nav>
  <div class="sb-sec">سیستم</div>
  <nav class="sb-nav" aria-label="سیستم">
    <sc-for list="{{sys}}" as="it" hint-placeholder-count="2">
      <a class="nav-a {{it.on}}" href="{{it.f}}"><dc-import name="Icon" i="{{it.ic}}" sz="16" hint-size="16px,16px"></dc-import><span>{{it.t}}</span></a>
    </sc-for>
  </nav>
  <a class="sb-user" href="W32-Profile.dc.html">
    <span class="av m a1">م.ا</span>
    <span class="col grow" style="line-height: 1.3"><strong class="t-13 fw6">مهندس احمدی</strong><small class="t-xs tx5">برنامه‌ریز پروژه</small></span>
    <span class="tx5" style="display: inline-flex"><dc-import name="Icon" i="more-vertical" sz="14" hint-size="14px,14px"></dc-import></span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","projects","structure","reports","risks","users","mgmt","settings","help","none"],"default":"projects"},"$preview":{"width":224,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'projects';
    const mk = (k, ic, t, f, n, nc) => ({ ic, t, f: f + '.dc.html', on: k === a ? 'on' : '', hasN: !!n, n: n || '', nc: nc || '' });
    return {
      main: [
        mk('dashboard', 'layout-dashboard', 'داشبورد', 'W05-Dashboard'),
        mk('projects', 'folder-kanban', 'پروژه‌ها', 'W07-Projects', '۱۲'),
        mk('structure', 'git-branch', 'ساختار WBS / CBS', 'W31-Templates'),
        mk('reports', 'clipboard-check', 'گزارش‌های فیلد', 'W20-FieldReports', '۲۴', 'w'),
        mk('risks', 'shield-alert', 'ریسک‌ها', 'W18-Risks', '۹'),
        mk('users', 'users', 'کاربران و نقش‌ها', 'W26-Users'),
        mk('mgmt', 'bar-chart-3', 'گزارش‌های مدیریتی', 'W25-ManagementReports')
      ],
      sys: [
        mk('settings', 'settings', 'تنظیمات', 'W28-SettingsGeneral'),
        mk('help', 'life-buoy', 'راهنما و پشتیبانی', 'W33-Help')
      ]
    };
  }
}
</script>
</body>
</html>
