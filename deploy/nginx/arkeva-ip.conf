# nginx میزبان، مرحلهٔ IP و HTTP (deploy/README.md). نصب:
#   sudo cp deploy/nginx/arkeva-ip.conf /etc/nginx/sites-available/arkeva
#   sudo ln -sf /etc/nginx/sites-available/arkeva /etc/nginx/sites-enabled/arkeva
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#
#   /        ← لندینگ        /opt/arkeva/landing
#   /panel/  ← پنل React     /opt/arkeva/frontend
#   /v1/     ← بک‌اند        127.0.0.1:3000 (هم‌مبدأ با پنل؛ کوکی تازه‌سازی Path=/v1/auth)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    charset utf-8;

    # پارچهٔ بارگذاری تا ۲ مگابایت (backend bootstrap/app.ts) و پروندهٔ XML برنامه
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── API ──
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # سلامت فقط از خود سرور (curl http://127.0.0.1:3000/health)، نه از بیرون
    location = /health { return 404; }
    location = /ready  { return 404; }
    location = /metrics { return 404; }

    # ── پنل ──
    location = /panel { return 301 /panel/; }
    location /panel/ {
        alias /opt/arkeva/frontend/;
        try_files $uri $uri/ /panel/index.html;
    }
    # فایل‌های هش‌دار Vite یک سال کش، index.html هرگز
    location /panel/assets/ {
        alias /opt/arkeva/frontend/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location = /panel/index.html {
        alias /opt/arkeva/frontend/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # دکمهٔ «ورود» لندینگ به /login می‌رود
    location = /login { return 302 /panel/login; }

    # ── لندینگ ──
    location / {
        root /opt/arkeva/landing;
        try_files $uri $uri/ /index.html;
    }
}
