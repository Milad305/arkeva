# مخزن واحد پروژه‌یار (docs/backend/03-project-structure.md ۱)
packages:
  - frontend
  - backend
  - packages/*

# @hookform/resolvers وابستگی zod را اعلام نمی‌کند؛ بی این، نوع‌هایش zod 4ِ hoist‌شده از puppeteer-core بک‌اند را
# می‌بیند و typecheck و build فرانت می‌شکند. با peer، همان zod 3 فرانت به آن پیوند می‌خورد.
packageExtensions:
  '@hookform/resolvers@3':
    peerDependencies:
      zod: '*'

allowBuilds:
  esbuild: false
  '@swc/core': false
  '@nestjs/core': false
  sharp: false
  '@scarf/scarf': false

# نسخه‌ای که از حداقل عمر انتشار pnpm جوان‌تر است استثنا نمی‌شود؛ نسخهٔ قبلی قفل می‌شود
# (docs/backend/02-stack.md، امنیت زنجیرهٔ تأمین)
