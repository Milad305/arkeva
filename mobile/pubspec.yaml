name: projeyar_field
description: "اپ سرپرست کارگاه پروژه‌یار (F08) — Flutter، اندروید."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

# بسته‌ها و دلیل هرکدام: docs/rules/flutter-clean-bloc.md بخش ۱
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # حالت
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  formz: ^0.8.0

  # معماری
  freezed_annotation: ">=2.4.0 <4.0.0"
  get_it: ^9.3.0
  go_router: ^17.2.3
  injectable: ">=2.5.0 <4.0.0"
  json_annotation: ">=4.9.0 <5.0.0"

  # داده و شبکه
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: ">=2.20.0 <3.0.0"
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4
  uuid: ^4.6.0

  # امنیت
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^9.2.4

  # تاریخ و زبان
  intl: ^0.20.2
  persian_datetime_picker: ^3.2.0
  shamsi_date: ^1.1.1
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

  # دستگاه
  camera: ^0.12.0+1
  flutter_local_notifications: ^20.1.0
  geolocator: ^14.0.2
  image: ^4.13.1
  package_info_plus: ^9.0.1
  workmanager: ^0.9.2

  # لاگ (فقط debug)
  talker_bloc_logger: ^5.2.0
  talker_dio_logger: ^5.2.0
  talker_flutter: ^5.1.16
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  build_runner: ">=2.4.0 <3.0.0"
  drift_dev: ">=2.20.0 <3.0.0"
  freezed: ">=2.5.0 <4.0.0"
  injectable_generator: ">=2.6.0 <4.0.0"
  json_serializable: ">=6.9.0 <7.0.0"
  mocktail: ^1.0.5
  very_good_analysis: ^10.0.0

# workmanager 0.9.2 lets pub pick workmanager_apple 0.9.4 with platform_interface 0.9.4,
# which do not compile together (foregroundServiceConfig). The fixed set (workmanager
# 0.9.3+) needs Flutter >=3.38. Pin the last compatible pair; remove when Flutter is upgraded.
dependency_overrides:
  workmanager_android: 0.9.2
  workmanager_platform_interface: 0.9.3

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
